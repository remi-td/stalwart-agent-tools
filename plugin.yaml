name: stalwart-agent-tools
version: 0.3.0
description: Profile-scoped JMAP, verified local SMTP submission, CalDAV, and constrained ICS bridge for explicitly bound non-family profiles.
author: Local
kind: backend
requires_hermes: ">=0.21.5"
provides_tools:
  - stalwart_mail_list
  - stalwart_mail_search
  - stalwart_mail_set_seen
  - stalwart_mail_draft
  - stalwart_mail_send
  - stalwart_mail_send_calendar_invitation
  - personal_calendar_query
  - stalwart_calendar_upsert
  - stalwart_calendar_delete
  - stalwart_calendar_subscribe_external
  - stalwart_calendar_refresh_external
config_schema:
  binding: {type: dict, required: true}
